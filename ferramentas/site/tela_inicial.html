<!-- Tela inicial do site: substitui o "Ready to start" padrão do pygbag.
     O script ferramentas/gerar_site.py insere este trecho no fim do index.html gerado. -->
<style>
    @font-face { font-family: "Exo 2"; font-weight: 600; src: url("fontes/Exo2-600.ttf"); }
    @font-face { font-family: "Exo 2"; font-weight: 800; src: url("fontes/Exo2-800.ttf"); }
    @font-face { font-family: "Exo 2"; font-weight: 900; src: url("fontes/Exo2-900.ttf"); }

    /* esconde a caixa e a barra de download padrão do pygbag */
    #infobox, #transfer { visibility: hidden !important; }

    #tela-inicial {
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; align-items: center; justify-content: center;
        padding: 16px; box-sizing: border-box;
        background-color: #ffffff;
        background-image:
            linear-gradient(#eaeff7 1px, transparent 1px),
            linear-gradient(90deg, #eaeff7 1px, transparent 1px);
        background-size: 32px 32px;
        font-family: "Exo 2", "Segoe UI", Arial, sans-serif;
        transition: opacity .6s ease;
    }
    #tela-inicial.saindo { opacity: 0; pointer-events: none; }

    .ti-cartao {
        width: min(520px, 100%); box-sizing: border-box;
        padding: 40px 32px 34px; text-align: center;
        background: linear-gradient(#2c4284, #1b2a5a 45%, #050916);
        border: 6px solid #c4ccda; border-radius: 30px;
        box-shadow: 0 26px 60px rgba(10, 17, 40, .35), inset 0 0 0 2px #344a82;
    }
    .ti-logo {
        width: 112px; height: 112px; margin: 0 auto 20px;
        display: flex; align-items: center; justify-content: center;
        background: #fff; border: 3px solid #00c8f0; border-radius: 24px;
        box-shadow: 0 0 34px rgba(0, 200, 240, .45);
    }
    .ti-logo img { width: 74%; height: auto; }
    .ti-titulo {
        color: #fff; font-weight: 900; line-height: 1;
        font-size: clamp(44px, 12vw, 76px); letter-spacing: 2px;
        text-shadow: 0 0 22px rgba(0, 200, 240, .85);
    }
    .ti-sub {
        margin-top: 10px; color: #c4ccda; font-weight: 800;
        font-size: clamp(12px, 3.4vw, 17px); letter-spacing: .4em;
    }
    .ti-sub b { color: #f04658; }
    .ti-linha { height: 2px; margin: 22px auto 0; width: 70%; background: linear-gradient(90deg, transparent, #c81e30, transparent); }

    .ti-botao {
        margin-top: 28px; padding: 16px 44px; cursor: pointer;
        font: 800 clamp(17px, 4.4vw, 22px) "Exo 2", "Segoe UI", Arial, sans-serif; letter-spacing: 1px;
        color: #fff; border: none; border-radius: 999px;
        background: linear-gradient(#f04658, #b01626);
        box-shadow: 0 6px 0 #6e0a16, 0 0 26px rgba(240, 70, 88, .5);
        animation: ti-pulsar 1.6s ease-in-out infinite;
        transition: transform .08s, box-shadow .08s;
    }
    .ti-botao:hover { filter: brightness(1.08); }
    .ti-botao:active { transform: translateY(4px); box-shadow: 0 2px 0 #6e0a16, 0 0 18px rgba(240, 70, 88, .4); }
    .ti-botao:disabled { animation: none; cursor: default; filter: saturate(.7); }

    .ti-offline {
        margin-top: 16px; padding: 9px 20px; cursor: pointer;
        display: inline-flex; align-items: center; gap: 8px;
        font: 700 clamp(13px, 3.4vw, 15px) "Exo 2", "Segoe UI", Arial, sans-serif; letter-spacing: 1px;
        color: #c4ccda; background: transparent;
        border: 2px solid rgba(196, 204, 218, .45); border-radius: 999px;
        transition: color .15s, border-color .15s, background .15s;
    }
    .ti-offline:hover { color: #fff; border-color: #00c8f0; background: rgba(0, 200, 240, .1); }
    .ti-offline svg { width: 18px; height: 18px; flex: none; }
    .ti-offline[hidden] { display: none; }

    .ti-status { margin-top: 20px; min-height: 1.3em; color: #96e1ff; font-weight: 600; font-size: 15px; }
    .ti-barra { width: 220px; height: 4px; margin: 10px auto 0; border-radius: 4px; overflow: hidden; background: #16304f; }
    .ti-barra i { display: block; width: 40%; height: 100%; background: #00c8f0; animation: ti-carregar 1.2s ease-in-out infinite; }
    .ti-barra.oculta { visibility: hidden; }

    @keyframes ti-pulsar { 50% { transform: scale(1.05); } }
    @keyframes ti-carregar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
</style>

<div id="tela-inicial">
    <div class="ti-cartao">
        <div class="ti-logo"><img src="logo_inicial.png" alt="Logo INBEC"></div>
        <div class="ti-titulo">JACKPOT</div>
        <div class="ti-sub">FACULDADE <b>INBEC</b></div>
        <div class="ti-linha"></div>
        <button class="ti-botao" id="ti-botao" type="button">CLIQUE PARA JOGAR</button>
        <!-- botão "jogar offline": a ação fica em ferramentas/site/instalar_app.html -->
        <button class="ti-offline" id="ti-offline" type="button" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>
            </svg>
            <span>OU JOGAR OFFLINE</span>
        </button>
        <div class="ti-status" id="ti-status">Carregando o jogo...</div>
        <div class="ti-barra" id="ti-barra"><i></i></div>
    </div>
</div>

<script>
(function () {
    const tela = document.getElementById("tela-inicial");
    const botao = document.getElementById("ti-botao");
    const status = document.getElementById("ti-status");
    const barra = document.getElementById("ti-barra");
    const caixaPygbag = document.getElementById("infobox");
    let clicou = false;
    let jogoIniciado = false;

    function esconder() {
        document.body.classList.add("jogo-iniciado");   // usado pelo aviso "Gire o celular" (ajuste_tela.html)
        tela.classList.add("saindo");
        setTimeout(() => tela.remove(), 700);
    }

    // O clique no botão é o "gesto do usuário" que os navegadores exigem para liberar o som.
    botao.addEventListener("click", () => {
        clicou = true;
        try { if (window.MM) window.MM.UME = true; } catch (e) {}
        if (jogoIniciado) return esconder();
        botao.disabled = true;
        botao.textContent = "PREPARANDO...";
        status.textContent = "Quase lá...";
        barra.classList.remove("oculta");
    });

    // Acompanha a caixa do pygbag: ela avisa quando terminou de baixar e some quando o jogo começa.
    // Qualquer toque na página (até no "jogar offline") libera o jogo, mas a tela inicial
    // só sai depois do "CLIQUE PARA JOGAR".
    new MutationObserver(() => {
        if (caixaPygbag.style.display === "none") {
            jogoIniciado = true;                         // o jogo começou
            if (clicou) esconder();
            else { status.textContent = "Pronto!"; barra.classList.add("oculta"); }
        } else if (!clicou && /Ready to start/i.test(caixaPygbag.textContent)) {   // textContent: a caixa está invisível
            status.textContent = "Pronto!";
            barra.classList.add("oculta");
        }
    }).observe(caixaPygbag, { attributes: true, childList: true, characterData: true, subtree: true });
})();
</script>
